name: Cycle 1 Baseline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-cycle1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Cycle 1 contract
        run: npm run validate:cycle1

      - name: Validate L01 authoring
        run: npm run validate:l01-authoring

      - name: Validate language proposals
        run: npm run validate:language-proposals

      - name: Validate progress tracker
        run: npm run validate:progress

      - name: Validate L01 OPI 001
        run: npm run validate:l01-opi001

      - name: Validate interrogatives
        run: npm run validate:interrogatives

      - name: Validate OPI matrix
        run: npm run validate:opi-matrix

      - name: Validate number system
        run: npm run validate:numbers

      - name: Validate numeral candidates
        run: npm run validate:numeral-candidates

      - name: Validate cardinals
        run: npm run validate:cardinals

      - name: Validate activation
        run: npm run validate:activation

      - name: Validate structures
        run: npm run validate:structures

      - name: Validate teacher notes
        run: npm run validate:teacher-notes

      - name: Validate QA lane
        run: npm run validate:qa

      - name: Validate stories
        run: npm run validate:stories

      - name: Validate vocabulary lane
        run: npm run validate:vocabulary

      - name: Validate vocabulary gap semantics
        run: npm run validate:vocabulary-gap-semantics

      - name: Validate vocabulary gap mapping
        run: npm run validate:vocabulary-gap-mapping

      - name: Validate vocabulary gap application
        run: npm run validate:vocabulary-gap-application

      - name: Validate review lane
        run: npm run validate:reviews

      - name: Validate Kether closure
        run: npm run validate:kether-closure

      - name: Validate L02 Chokhmah Source Lock
        run: npm run validate:l02-source-lock

      - name: Validate L02 semantic targets
        run: npm run validate:l02-semantic-targets

      - name: Validate L02 exact rebind application
        run: npm run validate:l02-rebind-review

      - name: Validate L02 unresolved vocabulary policy
        run: npm run validate:l02-unresolved-vocabulary

      - name: Validate L02 pedagogy source contract
        run: npm run validate:l02-pedagogy-source

      - name: Validate L02 OPI pattern review
        run: npm run validate:l02-opi-patterns

      - name: Validate L02 OPI authoring provenance
        run: npm run validate:l02-opi-authoring

      - name: Validate L02 OPI validation
        run: npm run validate:l02-opi-validation

      - name: Validate L02 SQS contract
        run: npm run validate:l02-sqs-contract

      - name: Validate L02 SQS pattern review
        run: npm run validate:l02-sqs-pattern-review

      - name: Validate L02 QA answer pattern gate
        run: npm run validate:l02-qa-answer-pattern
