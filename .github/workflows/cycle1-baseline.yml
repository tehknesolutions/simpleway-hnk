name: Cycle 1 Baseline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-cycle1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Cycle 1 baseline
        run: npm test
