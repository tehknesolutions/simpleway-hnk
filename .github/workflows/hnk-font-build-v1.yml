name: HNK Font Build V1
on:
  push:
    branches: [main]
    paths:
      - 'font/**'
      - 'src/hnk/hnk40-visual-canon-v2.mjs'
      - 'scripts/compile-hnk-font-v1.py'
      - '.github/workflows/hnk-font-build-v1.yml'
  pull_request:
    paths:
      - 'font/**'
      - 'src/hnk/hnk40-visual-canon-v2.mjs'
      - 'scripts/compile-hnk-font-v1.py'
      - '.github/workflows/hnk-font-build-v1.yml'
  workflow_dispatch:
jobs:
  build-font:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install 'fonttools[woff]>=4.55' brotli
      - run: python scripts/compile-hnk-font-v1.py
      - name: Verify 92/92 cmap
        run: python - <<'PY'
          from fontTools.ttLib import TTFont
          for f in ['font/dist/HNKVisualCanonV2-Regular.ttf','font/dist/HNKVisualCanonV2-Regular.otf','font/dist/HNKVisualCanonV2-Regular.woff2']:
              x=TTFont(f); c={k:v for t in x['cmap'].tables for k,v in t.cmap.items() if 0xE100<=k<=0xE233}
              assert len(c)==92,(f,len(c))
              assert 'SVG ' in x,f
              print('PASS',f,len(c))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: HNKVisualCanonV2-1.0.0
          path: |
            font/dist/HNKVisualCanonV2-Regular.ttf
            font/dist/HNKVisualCanonV2-Regular.otf
            font/dist/HNKVisualCanonV2-Regular.woff2
            font/dist/HNK_FONT_BUILD_REPORT_V1.json
