name: A1 Lab CI

on:
  pull_request:
    paths:
      - 'experiments/a1-rc1-sprint1/**'
      - 'tests/validate-a1-*.mjs'
      - 'package.json'
      - '.github/workflows/a1-sprint1-ci.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate A1 World 1
        run: npm run validate:a1-sprint1
      - name: Validate A1 World 2
        run: npm run validate:a1-sprint2
      - name: Validate A1 World 3
        run: npm run validate:a1-sprint3
      - name: Validate A1 World 4
        run: npm run validate:a1-sprint4
      - name: Validate A1 Final Boss
        run: npm run validate:a1-sprint5
      - name: Validate A1 Acquisition Engine
        run: npm run validate:a1-acquisition
      - name: Validate A1 Alpha release
        run: npm run validate:a1-release
      - name: Build Alpha deploy artifact
        run: npm run build:a1-alpha
      - name: Validate A1 MX1 syllable catalog
        run: npm run validate:a1-mx1-catalog
      - name: Run governed repository suite
        run: npm test
